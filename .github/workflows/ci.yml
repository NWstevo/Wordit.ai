name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - run: pip install -e .[dev]
    - run: black --check src tests
    - run: pylint src
    - run: mypy src
    - run: pytest --cov=wordit
